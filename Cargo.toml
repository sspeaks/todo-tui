[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sspeaks/todo-tui"
publish = false

[workspace.dependencies]
todo-core = { path = "crates/todo-core" }
todo-store = { path = "crates/todo-store" }
todo-sync = { path = "crates/todo-sync" }
todo-jira = { path = "crates/todo-jira" }
todo-assistant = { path = "crates/todo-assistant" }
todo-proto = { path = "crates/todo-proto" }
todo-daemon = { path = "crates/todo-daemon" }

anyhow = "1.0.104"
bytes = "1.12.1"
http-body = "1.1.0"
async-stream = "0.3.6"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["aws-lc-rs", "http1", "tls12", "rustls-platform-verifier"] }
jiff = { version = "0.2.38", features = ["serde"] }
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2"] }
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
toml = "1.1.8"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-types = "0.14.6"
tonic-web = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }
url = "2.5.8"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

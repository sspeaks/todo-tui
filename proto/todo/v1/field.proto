syntax = "proto3";

package todo.v1;

// Addressable Item fields, for FieldMask-style updates, patches, filters and
// sorting. Top-level values equal the Item field number (always below 1000).
// A nested target is `parent * 1000 + sub`, where parent is the Item field
// number of the sub-message and sub is the field number inside it (e.g.
// waiting.follow_up_on = 41 * 1000 + 4 = 41004).
//
// FieldValue lives in field_value.proto: it references Item sub-messages, and
// item.proto needs this enum, so keeping them apart avoids an import cycle.
enum ItemField {
  ITEM_FIELD_UNSPECIFIED = 0;

  // Identity.
  ITEM_FIELD_ID = 1;
  ITEM_FIELD_CREATED_VIA = 2;
  ITEM_FIELD_CREATED_AT = 3;
  ITEM_FIELD_UPDATED_AT = 4;
  ITEM_FIELD_REVISION = 5;
  ITEM_FIELD_REMOTE_LINK = 6;

  // Core.
  ITEM_FIELD_TITLE = 10;
  ITEM_FIELD_DESCRIPTION = 11;
  ITEM_FIELD_ITEM_TYPE = 12;
  ITEM_FIELD_STATUS_CATEGORY = 13;
  ITEM_FIELD_RESOLUTION_KIND = 14;
  ITEM_FIELD_REMOTE_STATUS_NAME = 15;
  ITEM_FIELD_PRIORITY = 16;
  ITEM_FIELD_ASSIGNEE = 17;
  ITEM_FIELD_REPORTER = 18;
  ITEM_FIELD_LABELS = 19;
  ITEM_FIELD_COMPONENTS = 20;
  ITEM_FIELD_FIX_VERSIONS = 21;
  ITEM_FIELD_DUE_DATE = 22;
  ITEM_FIELD_PARENT_ID = 23;
  ITEM_FIELD_SPRINT = 24;
  ITEM_FIELD_STORY_POINTS = 25;
  ITEM_FIELD_ORIGINAL_ESTIMATE = 26;
  ITEM_FIELD_REMAINING_ESTIMATE = 27;
  ITEM_FIELD_RESOLUTION = 28;
  ITEM_FIELD_REMOTE_CREATED_AT = 29;
  ITEM_FIELD_REMOTE_UPDATED_AT = 30;

  // Overlay.
  ITEM_FIELD_TODO_REFINEMENT = 40;
  ITEM_FIELD_WAITING = 41;
  ITEM_FIELD_DEFER_UNTIL = 42;
  ITEM_FIELD_PRIVATE_NOTES = 43;
  ITEM_FIELD_FOCUS_WEEK = 44;
  ITEM_FIELD_LOCAL_PRIORITY_OVERRIDE = 45;
  ITEM_FIELD_ARCHIVED = 46;
  ITEM_FIELD_RECURRENCE = 47;

  // Remote extras (read-only).
  ITEM_FIELD_REMOTE_EXTRAS = 60;

  // Derived and sync-state (read-only).
  ITEM_FIELD_STATUS = 70;
  ITEM_FIELD_EFFECTIVE_PRIORITY = 71;
  ITEM_FIELD_IS_MINE = 72;
  ITEM_FIELD_PENDING_FIELDS = 73;
  ITEM_FIELD_HAS_CONFLICT = 74;
  ITEM_FIELD_HAS_PUSH_FAILURE = 75;
  ITEM_FIELD_DESCRIPTION_LOSSY = 76;
  ITEM_FIELD_DESCRIPTION_DIRTY = 77;
  ITEM_FIELD_STALENESS = 78;
  ITEM_FIELD_SCOPES = 79;
  ITEM_FIELD_DELETED_AT = 80;
  ITEM_FIELD_MERGED_INTO = 81;
  ITEM_FIELD_IS_OVERDUE = 82;
  // Allocated (P4): ITEM_FIELD_IS_BLOCKED = 83;

  // Nested: waiting.*
  ITEM_FIELD_WAITING_ON = 41001;
  ITEM_FIELD_WAITING_REASON = 41002;
  ITEM_FIELD_WAITING_SINCE = 41003;
  ITEM_FIELD_WAITING_FOLLOW_UP_ON = 41004;

  // Nested: archived.*
  ITEM_FIELD_ARCHIVED_AT = 46001;
  ITEM_FIELD_ARCHIVED_REASON = 46002;

  // Nested: remote_link.*
  ITEM_FIELD_REMOTE_LINK_TRACKER_KIND = 6001;
  ITEM_FIELD_REMOTE_LINK_INSTANCE_ID = 6002;
  ITEM_FIELD_REMOTE_LINK_REMOTE_ID = 6003;
  ITEM_FIELD_REMOTE_LINK_KEY = 6004;
  ITEM_FIELD_REMOTE_LINK_URL = 6005;
  ITEM_FIELD_REMOTE_LINK_LAST_PULLED_VERSION = 6006;
  ITEM_FIELD_REMOTE_LINK_LINK_STATE = 6007;
  ITEM_FIELD_REMOTE_LINK_PINNED = 6008;

  // Nested: recurrence.*
  ITEM_FIELD_RECURRENCE_SERIES_ID = 47001;
  ITEM_FIELD_RECURRENCE_OCCURRENCE_DATE = 47002;

  // Nested: staleness.*
  ITEM_FIELD_STALENESS_LAST_USER_TOUCH_AT = 78001;
  ITEM_FIELD_STALENESS_LAST_REMOTE_CHANGE_AT = 78002;
  ITEM_FIELD_STALENESS_STATUS_ENTERED_AT = 78003;
  ITEM_FIELD_STALENESS_WAITING_SINCE = 78004;
}

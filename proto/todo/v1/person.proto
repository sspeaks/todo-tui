syntax = "proto3";

package todo.v1;

// A person (design 3.5), made from a tracker's user: who an Item is
// assigned to, reported by or waiting on. PersonRef.person_id names one.
// Each change of one is a TOPIC_PERSON change.
message Person {
  // ULID.
  string id = 1;
  string display_name = 2;
  // The tracker's login name; empty when not known.
  string username = 3;
  // The tracker's address first; empty when the tracker hides it.
  repeated string emails = 4;
  repeated PersonIdentity identities = 5;
}

// One tracker account of a person.
message PersonIdentity {
  string instance_id = 1;
  // Stable: a Data Center user key.
  string account_id = 2;
}

// A user of a tracker's directory not yet a Person here.
message DirectoryUser {
  string instance_id = 1;
  string account_id = 2;
  string display_name = 3;
  string username = 4;
  // Empty when the tracker hides it.
  string email = 5;
}

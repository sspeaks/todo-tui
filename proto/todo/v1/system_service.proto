syntax = "proto3";

package todo.v1;

import "todo/v1/config.proto";

service SystemService {
  // The first call from any client (design 4.2).
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  // Fails with FAILED_PRECONDITION when restart is requested while other
  // interactive clients are connected. Otherwise waits up to 10s for in-flight
  // work, responds, then exits.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  // The config the daemon is running with (design 8.2).
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // Reads config.toml again, as SIGHUP does. A file that is not valid TOML
  // fails with INVALID_ARGUMENT and the running config stays. A changed
  // snapshot is streamed as a TOPIC_CONFIG change.
  rpc ReloadConfig(ReloadConfigRequest) returns (ReloadConfigResponse);
  // Backs up the database now (design 7.5), as `todo backup now`, also when
  // automatic backups are off. Old backups are cleaned up only while they
  // are on.
  rpc Backup(BackupRequest) returns (BackupResponse);
  // Every record of the database (design 7.4) as lines of the export
  // format (todo.export.v1): the header first, then the records in
  // dependency order, a batch of lines per message.
  rpc Export(ExportRequest) returns (stream ExportResponse);
  // Puts an export into this database, which must be empty (no Item, no
  // op: FAILED_PRECONDITION / DATABASE_NOT_EMPTY otherwise), all or
  // nothing. A line that cannot go in is INVALID_ARGUMENT naming it
  // ("line 3"). Every client then resyncs.
  rpc Import(stream ImportRequest) returns (ImportResponse);
}

enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_KIND_INTERACTIVE = 1;
  CLIENT_KIND_ONESHOT = 2;
  CLIENT_KIND_MCP = 3;
  // The phone app, over the remote listener (ADR-0008). Interactive.
  CLIENT_KIND_MOBILE = 4;
}

message GetServerInfoRequest {
  ClientKind client_kind = 1;
  string client_version = 2;
  uint32 required_api_minor = 3;
}

message GetServerInfoResponse {
  string daemon_version = 1;
  // Bumped with every additive change to todo.v1, and again when an RPC
  // that answered UNIMPLEMENTED starts working.
  uint32 api_minor = 2;
  // e.g. "jira", "assistant".
  repeated string capabilities = 3;
}

message ShutdownRequest {
  // The caller will re-spawn the daemon (upgrade restart).
  bool restart = 1;
}

message ShutdownResponse {}

message GetConfigRequest {}

message GetConfigResponse {
  ConfigSnapshot config = 1;
  // The revision this was read at.
  uint64 revision = 2;
}

message ReloadConfigRequest {}

message ReloadConfigResponse {
  ConfigSnapshot config = 1;
  // Whether the snapshot differs from the one it replaced (loaded_at aside).
  bool changed = 2;
}

message BackupRequest {}

message BackupResponse {
  // The backup file.
  string path = 1;
  uint64 bytes = 2;
  // The old backups it deleted.
  repeated string removed = 3;
}

message ExportRequest {
  // Leave out the ops and events (the history behind undo).
  bool no_history = 1;
}

message ExportResponse {
  // JSON lines, without their newlines.
  repeated string lines = 1;
}

message ImportRequest {
  // JSON lines, in order across messages, the header first.
  repeated string lines = 1;
}

message ImportResponse {
  uint64 items = 1;
  // Records after the header.
  uint64 records = 2;
  // The database's revision after the import.
  uint64 revision = 3;
}

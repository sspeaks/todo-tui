syntax = "proto3";

package todo.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "todo/v1/common.proto";
import "todo/v1/filter.proto";
import "todo/v1/item.proto";
import "todo/v1/op.proto";
import "todo/v1/relation.proto";

// Conventions for every mutating request: request_id = 1 is a client ULID
// (a replay within 24h returns the original MutationResult with the Items'
// current state, even if they have changed since; reusing a request_id for a
// different request, i.e. another RPC or a single-item mutation of another
// Item, fails with INVALID_ARGUMENT and a BadRequest on "request_id");
// single-item mutations carry `optional uint64 expected_revision` and fail
// with ABORTED (ErrorInfo REVISION_MISMATCH) when the Item's revision
// differs; responses carry a MutationResult. Undo and Redo carry `optional
// string expected_op_id` instead, and the relation RPCs carry neither:
// relations are a set.
//
// Mutating a soft-deleted Item fails with FAILED_PRECONDITION (ErrorInfo
// ITEM_DELETED), except UndeleteItem, and DeleteItem, which is a no-op on a
// deleted Item. A mutation that changes nothing (e.g. archiving an archived
// Item) succeeds without a new revision. Invalid values and read-only fields
// fail with INVALID_ARGUMENT and a BadRequest naming the offending field
// path. No live Item has a deleted parent (design 3.7).
//
// The undo stack (design 3.10) is global, shared by all clients. Its entries
// are the ops by the user or a suggestion that changed something, except
// Undo and Redo themselves; a new entry clears the redo stack. Undo and Redo
// restore field values under a guard: a field gets the value back only if it
// still holds the value the reverted op wrote (string sets such as labels
// compare as sets), otherwise it keeps its current value and is reported in
// `skipped` (changed since, Item deleted, or no longer valid). A restored
// value is the recorded one, e.g. the original archived.at or deleted_at,
// not the current time. The staleness signals are restored only together
// with the content they belong to, also on an Item the Undo or Redo itself
// deletes, and are never reported in `skipped`. Relation steps are undone
// and redone also when an end is deleted. Like a BatchMutate, an Undo or
// Redo keeps the parent rule where it leaves the Items, not after each
// step; a step that would break it there is skipped as no longer valid. An
// Undo or Redo that restores nothing drops the entry from both stacks.
// Undo, Redo and the relation RPCs are not BatchMutate mutations.
service ItemService {
  rpc CaptureItem(CaptureItemRequest) returns (CaptureItemResponse);
  // Parses capture text without creating anything (the TUI's live preview).
  rpc ParseCapture(ParseCaptureRequest) returns (ParseCaptureResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);
  rpc ArchiveItem(ArchiveItemRequest) returns (ArchiveItemResponse);
  rpc UnarchiveItem(UnarchiveItemRequest) returns (UnarchiveItemResponse);
  // Soft delete (design 3.7): the Item stays as a tombstone with deleted_at
  // set and is hidden from every view. Never deletes in a tracker. Every live
  // descendant of the Item is soft-deleted with it, in the same op (their
  // changes arrive on the change stream).
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
  // Also restores the descendants that were deleted by the same op as the
  // Item (their changes arrive on the change stream). Fails with
  // FAILED_PRECONDITION (ErrorInfo PARENT_DELETED, with item_id and
  // parent_id) while the Item's parent is deleted: undelete the parent
  // first. In a BatchMutate the parent is checked as the whole batch leaves
  // it, so the order of the batch's undeletes does not matter.
  rpc UndeleteItem(UndeleteItemRequest) returns (UndeleteItemResponse);
  // Applies the mutations atomically as one op (one undo step): either all
  // succeed or none is applied. A precondition failure (ITEM_DELETED,
  // PARENT_DELETED) names the mutation's id path in its message, e.g.
  // "mutations[2].undelete_item.id: ...".
  rpc BatchMutate(BatchMutateRequest) returns (BatchMutateResponse);
  // Reverts the top entry of the undo stack and moves it to the redo stack;
  // an undone capture is soft-deleted. There is no out-of-order undo. With
  // an empty stack Undo succeeds with entry unset, and its request_id is
  // still recorded, so a late retry cannot undo a newer op.
  rpc Undo(UndoRequest) returns (UndoResponse);
  // Re-applies the most recently undone entry and moves it back to the undo
  // stack: it reverts what the entry's last undo restored, under the same
  // guard, so a partial undo gives a matching partial redo. With an empty
  // redo stack Redo succeeds as Undo does.
  rpc Redo(RedoRequest) returns (RedoResponse);
  // The entries Undo and Redo would act on next.
  rpc GetUndoState(GetUndoStateRequest) returns (GetUndoStateResponse);
  // Relations (design 3.6). Both ends must exist and differ, and to add a
  // relation both must be live; a relation is kept when an end is deleted,
  // and can still be removed then. A relation change is one op that gives
  // both ends a new revision. Adding a relation that exists, or removing one
  // that does not, changes nothing. Relations change only through these two
  // RPCs.
  rpc AddRelation(AddRelationRequest) returns (AddRelationResponse);
  rpc RemoveRelation(RemoveRelationRequest) returns (RemoveRelationResponse);
}

message CaptureItemRequest {
  string request_id = 1;
  // Raw capture text, parsed with the inline capture syntax (design 2.3).
  // Blank text, or text longer than 64 KiB (65536 bytes of UTF-8), fails
  // with INVALID_ARGUMENT on "text".
  string text = 2;
  // TUI, CLI or MCP; other values are reserved for the daemon.
  CreatedVia created_via = 3;
  // "Now" for relative dates in text, and the new Item's created_at (where
  // its staleness signals start); defaults to the daemon's clock. Spool
  // imports pass the original capture time.
  google.protobuf.Timestamp reference_time = 4;
  // Must name a live Item; a missing or deleted one fails with
  // INVALID_ARGUMENT on "parent_id".
  optional string parent_id = 5;
  // Spool entry id, a ULID: a capture whose spool_id was already captured
  // (by this RPC or a spool import) returns that capture, with no 24h limit.
  // The CLI sends its request_id here too, so a spooled copy of a capture
  // that did reach the daemon is never imported again.
  optional string spool_id = 6;
}

message CaptureItemResponse {
  Item item = 1;
  MutationResult result = 2;
  // What the text was parsed into, including any warnings. A replay returns
  // the text as parsed against the original request's reference_time.
  CaptureDraft draft = 3;
}

message ParseCaptureRequest {
  // Blank text parses to an empty draft. Text longer than 64 KiB (65536
  // bytes of UTF-8) fails with INVALID_ARGUMENT on "text", as in
  // CaptureItem.
  string text = 1;
  // "Now" for relative dates; defaults to the daemon's clock.
  google.protobuf.Timestamp reference_time = 2;
}

message ParseCaptureResponse {
  CaptureDraft draft = 1;
}

// The result of parsing capture text (design 2.3). A token that fails to
// parse stays in the title and adds a warning. When no title words remain,
// the whole text is kept as the title and no token is applied.
message CaptureDraft {
  string title = 1;
  // PRIORITY_NONE without a +N token.
  Priority priority = 2;
  google.type.Date due_date = 3;
  repeated string labels = 4;
  // Unset without a ~ token. Free text until People exist.
  PersonRef waiting_on = 5;
  // STATUS_INBOX unless a >next / >someday token says otherwise.
  Status status = 6;
  // Every sigil token in text order, applied or not.
  repeated CaptureToken tokens = 7;
  // Human-readable warnings, in text order.
  repeated string warnings = 8;
}

message CaptureToken {
  // Offsets into the text in Unicode code points (not bytes or UTF-16
  // units); end is exclusive.
  uint32 start = 1;
  uint32 end = 2;
  CaptureTokenKind kind = 3;
  // False when the token did not parse and stayed in the title, or was
  // overridden by a later token of the same kind.
  bool applied = 4;
  // Why the token was not applied; empty when applied.
  string warning = 5;
}

enum CaptureTokenKind {
  CAPTURE_TOKEN_KIND_UNSPECIFIED = 0;
  // +1 .. +5
  CAPTURE_TOKEN_KIND_PRIORITY = 1;
  // ^<date>
  CAPTURE_TOKEN_KIND_DUE_DATE = 2;
  // #<label>
  CAPTURE_TOKEN_KIND_LABEL = 3;
  // ~<person> or ~"<free text>"
  CAPTURE_TOKEN_KIND_WAITING = 4;
  // >next / >someday
  CAPTURE_TOKEN_KIND_STATUS = 5;
}

message GetItemRequest {
  string id = 1;
}

message GetItemResponse {
  // A soft-deleted Item is returned with deleted_at set. An Item merged into
  // another resolves to the merge target.
  Item item = 1;
  // The revision this was read at.
  uint64 revision = 2;
  // Set when id named a merged Item: the id that was requested.
  optional string resolved_from = 3;
}

message ListItemsRequest {
  Filter filter = 1;
  repeated SortKey sort = 2;
  // 0 means the server default.
  int32 page_size = 3;
  // From a previous response to the same filter and sort (INVALID_ARGUMENT
  // otherwise). Each page reads live data: a write between pages may show up
  // on a later page, and an item created behind the cursor is not returned.
  // Clients that need a consistent view subscribe from the first page's
  // revision and apply the changes.
  string page_token = 4;
  // When set, the request narrows this saved view: the effective filter is the
  // view's filter AND the request's filter (its all_of / any_of as one extra
  // all_of group), with each include_* flag true if true in either. A
  // non-empty request sort replaces the view's sort.
  optional string view_id = 5;
}

message ListItemsResponse {
  repeated Item items = 1;
  string next_page_token = 2;
  // The revision this page was read at (later pages may report a higher one).
  uint64 revision = 3;
}

// Partial update (design 4.3 rule 2). Only the paths in update_mask are
// written; everything else in item is ignored.
message UpdateItemRequest {
  string request_id = 1;
  // item.id names the Item; the masked fields carry the new values.
  Item item = 2;
  // Item field paths, e.g. "title", "due_date", "waiting" or
  // "waiting.follow_up_on". Must not be empty; "*" is not supported. A path
  // whose field is unset in item clears it (a field with a domain "none",
  // such as priority, takes that value instead). Status fields change only
  // through SetStatus, archived only through Archive/UnarchiveItem,
  // relations only through Add/RemoveRelation, and read-only, derived and
  // remote fields cannot be updated. Setting "waiting" without
  // waiting.since uses today. A title is stored trimmed and must then be
  // non-empty, one line and at most 64 KiB (65536 bytes of UTF-8);
  // description has no limit of its own.
  google.protobuf.FieldMask update_mask = 3;
  optional uint64 expected_revision = 4;
}

message UpdateItemResponse {
  Item item = 1;
  MutationResult result = 2;
}

// Sets the derived 6-value status, which the daemon decomposes into
// status_category, resolution_kind and todo_refinement (design 3.4).
message SetStatusRequest {
  string request_id = 1;
  string id = 2;
  Status status = 3;
  optional uint64 expected_revision = 4;
}

message SetStatusResponse {
  Item item = 1;
  MutationResult result = 2;
}

// Archives with reason ARCHIVE_REASON_USER.
message ArchiveItemRequest {
  string request_id = 1;
  string id = 2;
  optional uint64 expected_revision = 3;
}

message ArchiveItemResponse {
  Item item = 1;
  MutationResult result = 2;
}

message UnarchiveItemRequest {
  string request_id = 1;
  string id = 2;
  optional uint64 expected_revision = 3;
}

message UnarchiveItemResponse {
  Item item = 1;
  MutationResult result = 2;
}

message DeleteItemRequest {
  string request_id = 1;
  string id = 2;
  optional uint64 expected_revision = 3;
}

message DeleteItemResponse {
  // The tombstone, with deleted_at set. The descendants deleted with it are
  // not included: their changes arrive on the change stream.
  Item item = 1;
  MutationResult result = 2;
}

message UndeleteItemRequest {
  string request_id = 1;
  string id = 2;
  optional uint64 expected_revision = 3;
}

message UndeleteItemResponse {
  // The Item. The descendants restored with it are not included: their
  // changes arrive on the change stream.
  Item item = 1;
  MutationResult result = 2;
}

message BatchMutateRequest {
  string request_id = 1;
  // At most 1000. Mutations apply in order; several may target one Item, and
  // each expected_revision is checked against the Item as it was before the
  // batch.
  repeated Mutation mutations = 2;
}

// One single-item mutation within a batch. The nested request_id must be
// empty: the batch's request_id covers the whole op.
message Mutation {
  oneof kind {
    UpdateItemRequest update_item = 1;
    SetStatusRequest set_status = 2;
    ArchiveItemRequest archive_item = 3;
    UnarchiveItemRequest unarchive_item = 4;
    DeleteItemRequest delete_item = 5;
    UndeleteItemRequest undelete_item = 6;
  }
}

message BatchMutateResponse {
  // One per mutation, in request order, each in its state after the whole
  // batch (an Item mutated twice appears twice, identically). Descendants a
  // delete or undelete took along are not included: their changes arrive on
  // the change stream.
  repeated Item items = 1;
  MutationResult result = 2;
}

message UndoRequest {
  string request_id = 1;
  // The op_id of the entry the client means to undo (GetUndoState.undo); a
  // value that is not a ULID fails with INVALID_ARGUMENT on
  // "expected_op_id".
  // When the top entry is another one, or the stack is empty, Undo fails
  // with ABORTED (ErrorInfo UNDO_STACK_CHANGED, with expected_op_id and
  // top_op_id, empty for an empty stack), so an op made meanwhile by another
  // client is never undone by mistake.
  optional string expected_op_id = 2;
}

// A replay returns the original entry and skipped too.
message UndoResponse {
  // The undo op; without a new revision when nothing was restored.
  MutationResult result = 1;
  // The entry undone or dropped; unset when the stack was empty.
  OpSummary entry = 2;
  // The Items the undo changed, in their state after it. Empty with entry
  // set when it restored nothing, which dropped the entry.
  repeated Item items = 3;
  // The changes left as they were.
  repeated UndoSkip skipped = 4;
}

message RedoRequest {
  string request_id = 1;
  // As in UndoRequest, for the entry Redo would re-apply
  // (GetUndoState.redo).
  optional string expected_op_id = 2;
}

// A replay returns the original entry and skipped too.
message RedoResponse {
  // The redo op; without a new revision when nothing was restored.
  MutationResult result = 1;
  // The entry redone or dropped; unset when the stack was empty.
  OpSummary entry = 2;
  // The Items the redo changed, in their state after it. Empty with entry
  // set when it restored nothing, which dropped the entry.
  repeated Item items = 3;
  // The changes left as they were.
  repeated UndoSkip skipped = 4;
}

message GetUndoStateRequest {}

message GetUndoStateResponse {
  // The entry Undo would revert; unset when the undo stack is empty.
  OpSummary undo = 1;
  // The entry Redo would re-apply; unset when the redo stack is empty.
  OpSummary redo = 2;
}

// A from_id that names no Item fails with NOT_FOUND (ErrorInfo
// ITEM_NOT_FOUND), a deleted one with FAILED_PRECONDITION (ErrorInfo
// ITEM_DELETED). A to_id that names no Item, a deleted one, or from_id
// itself fails with INVALID_ARGUMENT on "relation.to_id", and an
// unspecified kind on "relation.kind" (an id that is not a ULID on its own
// path). Errors name each end as the request does, also for a RELATES_TO
// that is stored the other way round; when both ends are wrong, from_id is
// the one named.
message AddRelationRequest {
  string request_id = 1;
  Relation relation = 2;
}

message AddRelationResponse {
  // The relation's ends as stored (for RELATES_TO, from_id < to_id), in
  // their state after the op.
  Item from_item = 1;
  Item to_item = 2;
  MutationResult result = 3;
}

// Validated as in AddRelationRequest, except that either end may be
// deleted.
message RemoveRelationRequest {
  string request_id = 1;
  Relation relation = 2;
}

message RemoveRelationResponse {
  // As in AddRelationResponse.
  Item from_item = 1;
  Item to_item = 2;
  MutationResult result = 3;
}

syntax = "proto3";

package todo.v1;

import "google/protobuf/timestamp.proto";
import "todo/v1/field.proto";
import "todo/v1/field_value.proto";
import "todo/v1/common.proto";
import "todo/v1/item.proto";

// Jira sync (design 5, ADR-0006, ADR-0007): pulls, and the pushes of the
// fields that push.
service SyncService {
  // Each configured instance's sync state (design 5.11). The same state is
  // pushed to subscribers as Notice.sync_status whenever it changes.
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse);
  // Starts a pull now (design 5.4: a manual "sync now"), of one instance or
  // all of them, and returns at once; its progress is the sync status.
  // FAILED_PRECONDITION / NO_INSTANCE when none is configured.
  rpc SyncNow(SyncNowRequest) returns (SyncNowResponse);
  // What waits to reach the tracker, and what it refused while the Item's
  // push_failed Suggestion waits (design 5.6, 5.11): one entry per Item and
  // field, oldest first (`todo sync outbox`).
  rpc ListOutbox(ListOutboxRequest) returns (ListOutboxResponse);
  // Creates a Jira issue from a local Item (design 5.7) and links it,
  // while the caller waits: the Item takes the issue's fields, pinned.
  // FAILED_PRECONDITION / NO_INSTANCE, PUSH_OFF (the instance is read-only),
  // NO_PROMOTE_TARGET (no project given and no promote_default),
  // MISSING_FIELDS (Jira needs more: ErrorInfo metadata `fields` lists their
  // ids, the message what Jira said of each), ALREADY_LINKED; UNAVAILABLE when Jira does
  // not answer (a lost answer is looked for first, so nothing is created
  // twice). Not an undo stack entry.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  // Links a local Item to an existing issue by key (design 3.3), anyone's
  // the person can read: the Item takes Jira's fields, pinned, and the
  // values Jira replaced become a LINK_CONFLICT Suggestion. NOT_FOUND /
  // ISSUE_NOT_FOUND when Jira has no such issue the person can read;
  // ALREADY_LINKED; UNAVAILABLE. Not an undo stack entry.
  rpc Attach(AttachRequest) returns (AttachResponse);
}

message PromoteRequest {
  string item_id = 1;
  // The project key; empty for promote_default's.
  string project = 2;
  // The issue type's name; empty for promote_default's (a subtask of a
  // linked parent: subtask_issue_type).
  string issue_type = 3;
}

message PromoteResponse {
  Item item = 1;
  MutationResult result = 2;
  // A LINK_CONFLICT Suggestion when Jira changed what it was created with.
  string suggestion_id = 3;
}

message AttachRequest {
  string item_id = 1;
  // The issue's key, e.g. "PLAT-12".
  string key = 2;
}

message AttachResponse {
  Item item = 1;
  MutationResult result = 2;
  // The LINK_CONFLICT Suggestion of what Jira replaced, if anything.
  string suggestion_id = 3;
}

message ListOutboxRequest {
  // Empty for every instance.
  string instance_id = 1;
}

message ListOutboxResponse {
  repeated OutboxEntry entries = 1;
}

// One Item's change of one field on its way to the tracker. A status is
// STATUS_CATEGORY and/or RESOLUTION_KIND, whichever changed (one entry or
// two), pushed as one transition. A refusal is listed until the next one
// of its field, or until its push_failed Suggestion is applied or
// rejected; a deleted Item's entries are not listed.
message OutboxEntry {
  string instance_id = 1;
  string item_id = 2;
  // The issue's key, e.g. "PLAT-12".
  string remote_key = 3;
  string title = 4;
  ItemField field = 5;
  // The value it pushes; in flight, the value sent.
  FieldValue new = 6;
  OutboxState state = 7;
  uint32 attempts = 8;
  // Set while a retry waits (a transient failure, a 429's wait).
  google.protobuf.Timestamp next_attempt_at = 9;
  // The last failure, transient or the tracker's refusal.
  string last_error = 10;
  google.protobuf.Timestamp updated_at = 11;
}

enum OutboxState {
  OUTBOX_STATE_UNSPECIFIED = 0;
  OUTBOX_STATE_PENDING = 1;
  // Sent, its answer not read back yet.
  OUTBOX_STATE_IN_FLIGHT = 2;
  // The tracker refused it; its value is in a push_failed Suggestion.
  OUTBOX_STATE_FAILED = 3;
}

message GetSyncStatusRequest {}

message GetSyncStatusResponse {
  repeated SyncStatus instances = 1;
}

message SyncNowRequest {
  // Empty for every instance.
  string instance_id = 1;
}

message SyncNowResponse {
  // This request's number. The pass that serves it reports it (or a later
  // one) as SyncStatus.served_request, so a caller can wait for that pass.
  uint64 request = 1;
}

// One instance's sync state (design 5.11).
message SyncStatus {
  string instance_id = 1;
  SyncState state = 2;
  google.protobuf.Timestamp last_successful_pull_at = 3;
  // The last failure, for the status line; empty when the last pull was
  // fine.
  string last_error = 4;
  // Linked Items of this instance (live).
  uint32 items = 5;
  // While syncing: the issues this pull has handed over so far.
  uint32 pulled = 6;
  // The newest SyncNow request (SyncNowResponse.request) the latest pass
  // began after; 0 before any. A pass started after the request pulls
  // what changed before it, so once served_request reaches a caller's
  // request and the state is no longer SYNCING, its pull is done.
  uint64 served_request = 7;
  // Changes waiting to reach the tracker, and those it refused while their
  // push_failed Suggestion waits (design 5.11): the outbox, by Item and
  // field, a status (its category and resolution kind) counting once.
  // Current whatever the state: an edit made offline counts at once.
  uint32 pending_ops = 8;
  uint32 failed_ops = 9;
}

enum SyncState {
  // In a Notice: the instance is no longer configured.
  SYNC_STATE_UNSPECIFIED = 0;
  // Pulled, and nothing is wrong.
  SYNC_STATE_OK = 1;
  // A pull is running.
  SYNC_STATE_SYNCING = 2;
  // The tracker cannot be reached; pulls retry with backoff.
  SYNC_STATE_OFFLINE = 3;
  // The token was refused (or its credential cannot be read); pulls pause
  // until the config changes or SyncNow asks (after a new token is stored).
  SYNC_STATE_AUTH_ERROR = 4;
  // Reachable, but a pull failed for another reason (a bad scope query).
  SYNC_STATE_DEGRADED = 5;
  // Before its first pull.
  SYNC_STATE_STARTING = 6;
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # buf breaking compares against the local main branch, which a pull
      # request checkout does not have.
      - name: main branch for buf breaking
        run: git rev-parse --verify --quiet refs/heads/main || git branch main origin/main
      - name: buf lint and breaking
        run: pnpm lint:proto
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: pnpm gen
        run: pnpm gen
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm test
        run: pnpm test
